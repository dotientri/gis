server {
    listen 80;
    server_name congvienxanhhcm.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name congvienxanhhcm.me;

    ssl_certificate /etc/letsencrypt/live/congvienxanhhcm.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/congvienxanhhcm.me/privkey.pem;

    location / {
        proxy_pass http://qlycv_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve collected static files
    location /static/ {
        alias /var/www/static/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000";
        charset utf-8;
    }

    # Serve uploaded media files
    location /media/ {
        alias /var/www/media/;
        autoindex off;
        charset utf-8;
    }

    location /api/ {
        proxy_pass http://qlycv_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}