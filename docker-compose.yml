services:
  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: qlycv_db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup_full.sql:/docker-entrypoint-initdb.d/backup_full.sql

  backend:
    image: qlycv_backend:${IMAGE_TAG}
    container_name: qlycv_backend
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DEBUG=${DEBUG}
    depends_on:
      - db

  frontend:
    image: qlycv_frontend:${IMAGE_TAG}
    container_name: qlycv_frontend
    depends_on:
      - backend

  webserver:
    image: nginx:alpine
    container_name: qlycv_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: