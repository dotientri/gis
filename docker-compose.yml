version: '3.8'

services:
  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: qlycv_db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup_full.sql:/docker-entrypoint-initdb.d/backup_full.sql

  db-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    environment:
      # Đã sửa: Đồng bộ biến môi trường và trỏ đúng về service 'db'
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable"
    depends_on:
      - db

  backend:
    image: qlycv_backend:${IMAGE_TAG}
    container_name: qlycv_backend
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DEBUG=${DEBUG}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
    ports:
      # Đã sửa: Mở port 8000 ra ngoài để Prometheus từ K3s local ở nhà kéo metrics
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./qlycv/backend/media:/app/media
      - ./qlycv/backend/static:/app/static

  frontend:
    image: qlycv_frontend:${IMAGE_TAG}
    container_name: qlycv_frontend
    depends_on:
      - backend

  webserver:
    image: nginx:alpine
    container_name: qlycv_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./qlycv/backend/media:/var/www/media:ro
      - ./qlycv/backend/static:/var/www/static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro 
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: